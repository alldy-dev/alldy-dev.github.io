    <header class="header-nav">

        <nav class="naveg">

                <li><a href="index.html#about" class="header-link" data-i18n="nav.about">Sobre</a></li>

        <button type="button" class="theme-button" aria-label="Alternar entre tema claro e escuro">

            <!-- Moon icon -->
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>

            <!-- Sun icon-->
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />

        <button type="button" class="lang-button active" data-lang="pt">PT</button>
        <button type="button" class="lang-button" data-lang="es">ES</button>
        <button type="button" class="lang-button" data-lang="en">EN</button>

        <!--Menu button, is showing only in mobile and tablet -->
        <button type="button" class="menu-button" aria-label="Abrir menu">
            <!-- Menu icon-->
            <svg class="menu-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"

            </svg>

            <svg class="close-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                <path d="M6 6l12 12M18 6L6 18" />

    <main>
        <section class="presentation">
            <h1 data-i18n="intro.title">Apresentação</h1>
            <p data-i18n="intro.text">O vídeo vai aparecer aqui.</p>
